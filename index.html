<!DOCTYPE html>
<html lang="en">

    <title>NK THE RISE</title>

    <style>
        * {

            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111827, #4c1d95);
            color: white;
            text-align: center;
        }

        header {
            padding: 100px 20px;
        }

        h1 {
            font-size: 55px;
            color: #facc15;
            margin-bottom: 20px;
        }

        h2 {
            margin: 20px;
        }

        p {

            line-height: 1.7;
        }

        button {
            margin-top: 30px;
            padding: 15px 35px;
            background: #facc15;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        section {
            padding: 45px 20px;
        }

        footer {
            padding: 25px;
            background: #111827;
        }

    <header>

        <button onclick="alert('Your Journey Starts Today!')">

    <section>
        <h2>Our Vision</h2>

        <h2>Our Mission</h2>

    <footer>

</html>
